    { id: 'x5', priority: 5, hashtag: '#Ramos', heat: '⚡ 熱議', topic: '米蘭前鋒頂替 C 羅，挪威一戰鎖定出線', summary: '對丹麥也有進球。四戰全勝進八強。', reactions: [{ tone: 'positive', text: '「紅黑這邊終於有國家隊進球可寫。」' }, { tone: 'neutral', text: '「10/11 才看他穿隊服。」' }, { tone: 'funny', text: '「C 羅週三自己走了。」' }] },
    { id: 'x6', priority: 6, hashtag: '#Ronaldo', heat: '⚡ 熱議', topic: '得知不會先發後退出葡萄牙名單', summary: '丹麥、挪威兩場都沒有他。葡萄牙照贏。', reactions: [{ tone: 'negative', text: '「這個時間點離開，比坐板凳更吵。」' }, { tone: 'neutral', text: '「教頭選了 Ramos。」' }, { tone: 'funny', text: '「41 歲，小組已經出線。」' }] },
    { id: 'x7', priority: 7, hashtag: '#Gordon', heat: '⚡ 熱議', topic: '巴薩邊鋒這窗口第三球，在 7-0 裡', summary: '39\' 頭槌。70\' 被換下。溫布利那晚還是輸給西班牙。', reactions: [{ tone: 'positive', text: '「英格蘭左邊現在靠他。」' }, { tone: 'neutral', text: '「巴薩週二還有 Yamal 要踢。」' }, { tone: 'funny', text: '「一個俱樂部，兩個國家隊進球。」' }] },
    { id: 'x8', priority: 8, hashtag: '#Modric', heat: '💬 討論', topic: '57\' 被換下，克羅埃西亞歐國聯紀錄失利', summary: '上週他還有進球。這場 Bellingham 把中場贏走。', reactions: [{ tone: 'negative', text: '「0-7 不是換人能解釋的。」' }, { tone: 'neutral', text: '「週二還要碰西班牙。」' }, { tone: 'positive', text: '「至少里耶卡之前拿過捷克 3 分。」' }] },
    { id: 'x9', priority: 9, hashtag: '#NationsLeague', heat: '💬 討論', topic: '今晚法國對比利時，分差只剩 1 分', summary: '義大利主場土耳其。週二西班牙、英格蘭收窗。', reactions: [{ tone: 'positive', text: '「A1 組今晚就是榜首戰。」' }, { tone: 'neutral', text: '「姆巴佩確定不踢。」' }, { tone: 'funny', text: '「齊達內主場首戰才被義大利逼平。」' }] },
    { id: 'x10', priority: 10, hashtag: '#Anfield', heat: '💬 討論', topic: '10/11 還是五連勝對上利物浦', summary: '上訴在，罰則不在。Haaland 國家隊兩場沒開張。', reactions: [{ tone: 'neutral', text: '「先把國家隊週過完。」' }, { tone: 'negative', text: '「前鋒這週的狀態要帶去安菲爾德。」' }, { tone: 'positive', text: '「場外那件事今晚不會有新判決。」' }] },
];
const REACTION_TONE = {
    positive: { label: '支持', cls: 'text-emerald-400 bg-emerald-950', quote: 'reaction-positive' },
    negative: { label: '批評', cls: 'text-red-400 bg-red-950', quote: 'reaction-negative' },
    neutral:  { label: '中立', cls: 'text-zinc-400 bg-zinc-800', quote: 'reaction-neutral' },
    funny:    { label: '幽默', cls: 'text-amber-400 bg-amber-950', quote: 'reaction-funny' },
};

const $ = id => document.getElementById(id);

function getTaipeiToday() {
    return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
    }).format(new Date());
}

function teamById(id) {
    if (id === 'nl') {
        return {
            border: 'border-indigo-400/45',
            accent: 'text-indigo-300',
            nameZh: '歐國聯',
            league: '國家隊',
        };
    }
    return FOCUS_TEAMS.find(t => t.id === id);
}

function renderFocusTeams() {
    $('focus-teams').innerHTML = FOCUS_TEAMS.map(t => `
        <span class="team-chip inline-flex items-center gap-2 px-3 py-1.5 rounded-2xl border text-xs font-semibold ${t.chip}">
            <span class="font-bold">${t.short}</span>
            <span>${t.nameZh}</span>
            <span class="opacity-70">${t.league}</span>
        </span>
    `).join('');
}

function renderTeamsDetail() {
    $('teams-detail').innerHTML = FOCUS_TEAMS.map(t => `
        <div class="fade-in match-card bg-zinc-900 border ${t.border} rounded-3xl p-5">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold px-2.5 py-1 rounded-xl ${t.badge}">${t.league}</span>
                <span class="text-xs text-zinc-500">${t.nameEn}</span>
            </div>
            <h3 class="text-xl font-bold ${t.accent}">${t.nameZh}</h3>
            <p class="text-sm text-zinc-400 mt-2 leading-relaxed">${t.blurb}</p>
        </div>
    `).join('');
}

function statusBadge(status) {
    if (status === 'finished') return { label: '已結束', cls: 'bg-zinc-800 text-zinc-400' };
    if (status === 'live') return { label: '進行中', cls: 'bg-amber-950 text-amber-400' };
    if (status === 'preview') return { label: '預告', cls: 'bg-purple-950 text-purple-400' };
    return { label: '即將開賽', cls: 'bg-blue-950 text-blue-400' };
}

function renderFixtures() {
    const grid = $('fixtures-grid');
    const list = WEEK_FIXTURES;
    $('fixture-count').textContent = list.length ? `（${list.length} 場）` : '';
    if (!list.length) {
        grid.innerHTML = '';
        $('no-fixtures').classList.remove('hidden');
        return;
    }
    $('no-fixtures').classList.add('hidden');
    grid.innerHTML = list.map(f => {
        const t = teamById(f.team);
        const st = statusBadge(f.status);
        const score = f.score
            ? `<span class="text-emerald-400 tabular-nums font-bold">${f.score.home}</span>
               <span class="text-zinc-600 mx-1">-</span>
               <span class="text-red-400 tabular-nums font-bold">${f.score.away}</span>
               ${f.pens ? `<span class="text-xs text-amber-400 ml-2">（點球 ${f.pens}）</span>` : ''}`
            : `<span class="text-zinc-500 text-sm">vs</span>`;
        return `
        <div class="match-card fade-in bg-zinc-900 border ${t ? t.border : 'border-zinc-700'} rounded-3xl p-5">
            <div class="flex items-center gap-2 mb-3 flex-wrap">
                <span class="text-xs px-2.5 py-0.5 rounded-xl ${st.cls}">${st.label}</span>
                <span class="text-xs text-zinc-500">${f.competition}</span>
                <span class="text-xs text-zinc-600 ml-auto">${f.dateLabel}</span>
            </div>
            <div class="flex items-center gap-3 font-semibold text-lg flex-wrap">
                <span>${f.home}</span>
                ${score}
                <span>${f.away}</span>
            </div>
            ${f.note ? `<p class="text-xs text-zinc-500 mt-2">${f.note}</p>` : ''}
            ${t ? `<p class="text-xs ${t.accent} mt-2 font-medium">${t.nameZh} · ${t.league}</p>` : ''}
        </div>`;
    }).join('');
}

function renderNewsCard(n, i) {
    return `
        <article class="news-card fade-in bg-zinc-900 border ${n.border} rounded-3xl p-6 md:p-7">
            <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="text-xs font-bold text-zinc-500 tabular-nums">#${i + 1}</span>
                ${(n.tags || []).map(t => `
                    <span class="text-xs font-bold px-3 py-1 rounded-2xl ${t.cls}">${t.text}</span>
                `).join('')}
                ${n.meta ? `<span class="text-xs text-zinc-500 ml-auto">${n.meta}</span>` : ''}
            </div>
            <h3 class="font-bold text-lg md:text-xl leading-snug">${n.title}</h3>
            <p class="text-sm md:text-base text-zinc-300 mt-3 leading-relaxed">${n.summary}</p>
            ${n.points?.length ? `
                <ul class="news-points mt-4 space-y-2 text-sm text-zinc-400 pl-5">
                    ${n.points.map(p => `<li class="leading-relaxed">${p}</li>`).join('')}
                </ul>
            ` : ''}
            ${n.source ? `
                <p class="text-xs text-zinc-600 mt-4 pt-3 border-t border-zinc-800">
                    <i class="fa-solid fa-link mr-1"></i>參考來源：${n.source}
                </p>
            ` : ''}
        </article>`;
}

function generateWeekNews() {
    return [...WEEKLY_TOP_NEWS].sort((a, b) => a.priority - b.priority).slice(0, 10);
}

function generateTransfers() {
    return [...TRANSFER_NEWS].sort((a, b) => a.priority - b.priority);
}

function renderTransferCard(n, i) {
    const st = n.status ? `<span class="text-xs font-bold px-2.5 py-0.5 rounded-xl ${n.statusCls || 'bg-zinc-800 text-zinc-300'}">${n.status}</span>` : '';
    return `
        <article class="news-card fade-in bg-zinc-900 border ${n.border} rounded-3xl p-6 md:p-7">
            <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="text-xs font-bold text-zinc-500 tabular-nums">#${i + 1}</span>
                ${st}
                ${(n.tags || []).map(t => `<span class="text-xs font-bold px-3 py-1 rounded-2xl ${t.cls}">${t.text}</span>`).join('')}
                ${n.meta ? `<span class="text-xs text-zinc-500 ml-auto">${n.meta}</span>` : ''}
            </div>
            <h3 class="font-bold text-lg md:text-xl leading-snug">${n.title}</h3>
            <p class="text-sm md:text-base text-zinc-300 mt-3 leading-relaxed">${n.summary}</p>
            ${n.points?.length ? `<ul class="news-points mt-4 space-y-2 text-sm text-zinc-400 pl-5">${n.points.map(p => `<li class="leading-relaxed">${p}</li>`).join('')}</ul>` : ''}
            ${n.source ? `<p class="text-xs text-zinc-600 mt-4 pt-3 border-t border-zinc-800"><i class="fa-solid fa-link mr-1"></i>參考來源：${n.source}</p>` : ''}
        </article>`;
}

function renderTransfers() {
    const items = generateTransfers();
    const htmlCards = items.map((n, i) => renderTransferCard(n, i)).join('');
    const el2 = $('transfer-list-tab');
    if (el2) el2.innerHTML = htmlCards;
}

function generateTeamNews() {
    return [...TEAM_NEWS].sort((a, b) => a.priority - b.priority);
}

function generateTrending() {
    return [...X_TRENDING].sort((a, b) => a.priority - b.priority).slice(0, TRENDING_LIMIT);
}

function renderNews() {
    const news = generateWeekNews();
    $('news-list').innerHTML = news.map((n, i) => renderNewsCard(n, i)).join('');
}

function renderTeamNews() {
    const news = generateTeamNews();
    $('team-news-list').innerHTML = news.map((n, i) => renderNewsCard(n, i)).join('');
}

function renderTrendingCard(t, i) {
    const reactions = (t.reactions || []).map(r => {
        const tone = REACTION_TONE[r.tone] || REACTION_TONE.neutral;
        return `
            <div class="reaction-quote ${tone.quote} py-2">
                <span class="text-xs font-bold px-2 py-0.5 rounded-lg ${tone.cls} mr-2">${tone.label}</span>
                <span class="text-sm text-zinc-400 leading-relaxed">${r.text}</span>
            </div>`;
    }).join('');

    return `
        <article class="trend-card fade-in bg-zinc-900 border border-zinc-700 rounded-3xl p-6 md:p-7">
            <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="text-xs font-bold text-zinc-500 tabular-nums">#${i + 1}</span>
                <span class="text-sm font-bold text-zinc-200">${t.hashtag}</span>
                <span class="text-xs font-bold px-3 py-1 rounded-2xl text-rose-400 bg-rose-950">${t.heat}</span>
            </div>
            <h3 class="font-bold text-lg md:text-xl leading-snug">${t.topic}</h3>
            <p class="text-sm md:text-base text-zinc-300 mt-3 leading-relaxed">${t.summary}</p>
            ${reactions ? `
                <div class="mt-4 pt-4 border-t border-zinc-800 space-y-1">
                    <p class="text-xs font-semibold text-zinc-500 mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-comments text-zinc-600"></i>網友評論摘要
                    </p>
                    ${reactions}
                </div>
            ` : ''}
        </article>`;
}

function renderTrending() {
    const items = generateTrending();
    $('trending-list').innerHTML = items.map((t, i) => renderTrendingCard(t, i)).join('');
}

function updateTabBadges() {
    $('tab-week-badge').textContent = `${generateWeekNews().length} 則`;
    $('tab-teams-badge').textContent = `${generateTeamNews().length} 則`;
    const tr = $('tab-transfer-badge');
    if (tr) tr.textContent = `${generateTransfers().length} 則`;
    $('tab-trending-badge').textContent = `${generateTrending().length} 則`;
}

function switchTab(tab) {
    ['week', 'teams', 'transfer', 'trending'].forEach(t => {
        $(`tab-${t}`).classList.toggle('active', t === tab);
        $(`panel-${t}`).classList.toggle('active', t === tab);
    });
}

function setupTabs() {
    $('tab-week').addEventListener('click', () => switchTab('week'));
    $('tab-teams').addEventListener('click', () => switchTab('teams'));
    $('tab-transfer').addEventListener('click', () => switchTab('transfer'));
    $('tab-trending').addEventListener('click', () => switchTab('trending'));
}

function renderAll() {
    const tp = getTaipeiToday().replace(/-/g, '/');
    $('date-label').textContent = `${tp} · 本週 ${NEWS_WEEK} · ${APP_VERSION}`;
    renderFocusTeams();
    renderTeamsDetail();
    renderFixtures();
    renderTransfers();
    renderNews();
    renderTeamNews();
    renderTrending();
    updateTabBadges();
}

function showToast(msg, ok = true) {
    const t = $('toast');
    $('toast-msg').textContent = msg;
    $('toast-icon').className = ok ? 'fa-solid fa-check text-emerald-400' : 'fa-solid fa-xmark text-red-400';
    t.classList.remove('hidden');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.add('hidden'), 2800);
}

function setLoading(on) {
    const btn = $('btn-refresh');
    const icon = $('refresh-icon');
    btn.disabled = on;
    if (on) {
        icon.className = 'fa-solid fa-sync-alt spin';
        $('refresh-text').textContent = '更新中…';
    } else {
        icon.className = 'fa-solid fa-bolt';
        $('refresh-text').textContent = '重新整理';
    }
}

function refreshData() {
    setLoading(true);
    try {
        renderAll();
        const now = new Date().toLocaleTimeString('zh-TW', {
            timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
        $('last-updated').textContent = `最後更新：${now}`;
        showToast('已重新整理本週內容');
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ week: NEWS_WEEK, at: Date.now() })); } catch {}
    } finally {
        setLoading(false);
    }
}

function boot() {
    try {
        setupTabs();
        renderAll();
        const now = new Date().toLocaleTimeString('zh-TW', {
            timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
        $('last-updated').textContent = `最後更新：${now}`;
        $('btn-refresh').addEventListener('click', refreshData);
    } catch (err) {
        console.error(err);
        $('date-label').textContent = '載入失敗 · ' + APP_VERSION;
    }
}

boot();
</script>
</body>
</html>
