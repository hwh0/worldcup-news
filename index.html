const $ = id => document.getElementById(id);

function getTaipeiToday() {
    return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
    }).format(new Date());
}

function teamById(id) {
    return FOCUS_TEAMS.find(t => t.id === id);
}

function renderFocusTeams() {
    $('focus-teams').innerHTML = FOCUS_TEAMS.map(t => `
        <span class="team-chip inline-flex items-center gap-2 px-3 py-1.5 rounded-2xl border text-xs font-semibold ${t.chip}">
            <span class="font-bold">${t.short}</span>
            <span>${t.nameZh}</span>
            <span class="opacity-70">${t.league}</span>
        </span>
    `).join('');
}

function renderTeamsDetail() {
    $('teams-detail').innerHTML = FOCUS_TEAMS.map(t => `
        <div class="fade-in match-card bg-zinc-900 border ${t.border} rounded-3xl p-5">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold px-2.5 py-1 rounded-xl ${t.badge}">${t.league}</span>
                <span class="text-xs text-zinc-500">${t.nameEn}</span>
            </div>
            <h3 class="text-xl font-bold ${t.accent}">${t.nameZh}</h3>
            <p class="text-sm text-zinc-400 mt-2 leading-relaxed">${t.blurb}</p>
        </div>
    `).join('');
}

function statusBadge(status) {
    if (status === 'finished') return { label: '已結束', cls: 'bg-zinc-800 text-zinc-400' };
    if (status === 'live') return { label: '進行中', cls: 'bg-amber-950 text-amber-400' };
    if (status === 'preview') return { label: '預告', cls: 'bg-purple-950 text-purple-400' };
    return { label: '即將開賽', cls: 'bg-blue-950 text-blue-400' };
}

function renderFixtures() {
    const grid = $('fixtures-grid');
    const list = WEEK_FIXTURES;
    $('fixture-count').textContent = list.length ? `（${list.length} 場）` : '';
    if (!list.length) {
        grid.innerHTML = '';
        $('no-fixtures').classList.remove('hidden');
        return;
    }
    $('no-fixtures').classList.add('hidden');
    grid.innerHTML = list.map(f => {
        const t = teamById(f.team);
        const st = statusBadge(f.status);
        const score = f.score
            ? `<span class="text-emerald-400 tabular-nums font-bold">${f.score.home}</span>
               <span class="text-zinc-600 mx-1">-</span>
               <span class="text-red-400 tabular-nums font-bold">${f.score.away}</span>
               ${f.pens ? `<span class="text-xs text-amber-400 ml-2">（點球 ${f.pens}）</span>` : ''}`
            : `<span class="text-zinc-500 text-sm">vs</span>`;
        return `
        <div class="match-card fade-in bg-zinc-900 border ${t ? t.border : 'border-zinc-700'} rounded-3xl p-5">
            <div class="flex items-center gap-2 mb-3 flex-wrap">
                <span class="text-xs px-2.5 py-0.5 rounded-xl ${st.cls}">${st.label}</span>
                <span class="text-xs text-zinc-500">${f.competition}</span>
                <span class="text-xs text-zinc-600 ml-auto">${f.dateLabel}</span>
            </div>
            <div class="flex items-center gap-3 font-semibold text-lg flex-wrap">
                <span>${f.home}</span>
                ${score}
                <span>${f.away}</span>
            </div>
            ${f.note ? `<p class="text-xs text-zinc-500 mt-2">${f.note}</p>` : ''}
            ${t ? `<p class="text-xs ${t.accent} mt-2 font-medium">${t.nameZh} · ${t.league}</p>` : ''}
        </div>`;
    }).join('');
}

function renderNewsCard(n, i) {
    return `
        <article class="news-card fade-in bg-zinc-900 border ${n.border} rounded-3xl p-6 md:p-7">
            <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="text-xs font-bold text-zinc-500 tabular-nums">#${i + 1}</span>
                ${(n.tags || []).map(t => `
                    <span class="text-xs font-bold px-3 py-1 rounded-2xl ${t.cls}">${t.text}</span>
                `).join('')}
                ${n.meta ? `<span class="text-xs text-zinc-500 ml-auto">${n.meta}</span>` : ''}
            </div>
            <h3 class="font-bold text-lg md:text-xl leading-snug">${n.title}</h3>
            <p class="text-sm md:text-base text-zinc-300 mt-3 leading-relaxed">${n.summary}</p>
            ${n.points?.length ? `
                <ul class="news-points mt-4 space-y-2 text-sm text-zinc-400 pl-5">
                    ${n.points.map(p => `<li class="leading-relaxed">${p}</li>`).join('')}
                </ul>
            ` : ''}
            ${n.source ? `
                <p class="text-xs text-zinc-600 mt-4 pt-3 border-t border-zinc-800">
                    <i class="fa-solid fa-link mr-1"></i>參考來源：${n.source}
                </p>
            ` : ''}
        </article>`;
}

function generateWeekNews() {

}

function generateTransfers() {

    return `
        <article class="news-card fade-in bg-zinc-900 border ${n.border} rounded-3xl p-6 md:p-7">
            <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="text-xs font-bold text-zinc-500 tabular-nums">#${i + 1}</span>
                ${st}

    const reactions = (t.reactions || []).map(r => {
        const tone = REACTION_TONE[r.tone] || REACTION_TONE.neutral;

            <div class="reaction-quote ${tone.quote} py-2">

function renderTrending() {

function updateTabBadges() {
    $('tab-week-badge').textContent = `${generateWeekNews().length} 則`;
    $('tab-teams-badge').textContent = `${generateTeamNews().length} 則`;
    const tr = $('tab-transfer-badge');
    if (tr) tr.textContent = `${generateTransfers().length} 則`;
    $('tab-trending-badge').textContent = `${generateTrending().length} 則`;
}

function switchTab(tab) {
    ['week', 'teams', 'transfer', 'trending'].forEach(t => {
        $(`tab-${t}`).classList.toggle('active', t === tab);
        $(`panel-${t}`).classList.toggle('active', t === tab);
    });
}

function setupTabs() {
    $('tab-week').addEventListener('click', () => switchTab('week'));
    $('tab-teams').addEventListener('click', () => switchTab('teams'));
    $('tab-transfer').addEventListener('click', () => switchTab('transfer'));
    $('tab-trending').addEventListener('click', () => switchTab('trending'));
}

function renderAll() {
    const tp = getTaipeiToday().replace(/-/g, '/');
    $('date-label').textContent = `${tp} · 本週 ${NEWS_WEEK} · ${APP_VERSION}`;
    renderFocusTeams();
    renderTeamsDetail();
    renderFixtures();
    renderTransfers();
    renderNews();
    renderTeamNews();
    renderTrending();
    updateTabBadges();
}

function showToast(msg, ok = true) {
    const t = $('toast');
    $('toast-msg').textContent = msg;
    $('toast-icon').className = ok ? 'fa-solid fa-check text-emerald-400' : 'fa-solid fa-xmark text-red-400';
    t.classList.remove('hidden');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.add('hidden'), 2800);
}

function setLoading(on) {
    const btn = $('btn-refresh');
    const icon = $('refresh-icon');
    btn.disabled = on;
    if (on) {
        icon.className = 'fa-solid fa-sync-alt spin';
        $('refresh-text').textContent = '更新中…';
    } else {
        icon.className = 'fa-solid fa-bolt';
        $('refresh-text').textContent = '重新整理';
    }
}

function refreshData() {
    setLoading(true);
    try {
        renderAll();
        const now = new Date().toLocaleTimeString('zh-TW', {
            timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
        $('last-updated').textContent = `最後更新：${now}`;
        showToast('已重新整理本週內容');
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ week: NEWS_WEEK, at: Date.now() })); } catch {}
    } finally {
        setLoading(false);
    }
}

function boot() {
    try {
        setupTabs();
        renderAll();
        const now = new Date().toLocaleTimeString('zh-TW', {
            timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
        $('last-updated').textContent = `最後更新：${now}`;
        $('btn-refresh').addEventListener('click', refreshData);
    } catch (err) {
        console.error(err);
        $('date-label').textContent = '載入失敗 · ' + APP_VERSION;
    }
}

boot();
</script>
</body>
</html>
